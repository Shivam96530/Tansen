services:
  - type: web
    name: tansen
    runtime: node
    buildCommand: npm ci && npm run build && npm --prefix server ci --omit=dev
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: STREAM_BASE_URL
        sync: false
      - key: GENIUS_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_CHAT_MODEL
        value: Qwen/Qwen3-32B:fastest
  - type: web
    name: tansen-stream
    runtime: python
    rootDir: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 audio_service:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GENIUS_ACCESS_TOKEN
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false
