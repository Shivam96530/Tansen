<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tansen — a full-stack music experience. Stream audio, read synced lyrics and discover songs by mood." />
    <title>Tansen — Music, Lyrics &amp; Mood Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="yt-player-container" style="position:fixed;bottom:8px;right:8px;width:64px;height:64px;opacity:0.12;overflow:hidden;pointer-events:none;z-index:1;border-radius:8px;">
      <div id="tansen-yt-player"></div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
